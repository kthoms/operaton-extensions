# Local services for running the example: docker compose up -d --wait
# Then pull the small model once (about 1 GB): docker compose exec ollama ollama pull qwen2.5:1.5b
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: operaton
      POSTGRES_USER: operaton
      POSTGRES_PASSWORD: operaton
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operaton"]
      interval: 5s
      retries: 10
  ollama:
    image: ollama/ollama:0.40.17
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20
volumes:
  ollama-models:
