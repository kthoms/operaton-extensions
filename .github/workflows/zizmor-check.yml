# Audits the workflows and the Dependabot configuration with zizmor on every change to them.
name: Check GitHub Workflow Security

permissions: {}

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
    paths:
      - .github/workflows/*.yml
      - .github/dependabot.yml
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'
    paths:
      - .github/workflows/*.yml
      - .github/dependabot.yml

jobs:
  zizmor:
    name: Analyze workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: regular
          advanced-security: false
