[package]
name = "operaton-external-task-client"
version = "0.1.0"
edition = "2021"
description = "External task client for Operaton: long-polling fetch-and-lock workers over the REST API, typed variables, retries, BPMN errors and graceful shutdown."
license = "Apache-2.0"
repository = "https://github.com/kthoms/operaton-extensions"
homepage = "https://github.com/kthoms/operaton-extensions/tree/main/clients/rust"
readme = "README.md"
keywords = ["operaton", "bpmn", "external-task", "workflow", "camunda"]
categories = ["api-bindings", "asynchronous"]
exclude = ["example/", "target/"]

[lib]
name = "operaton_external_task_client"
path = "src/lib.rs"

[features]
default = []
# Integration tests against a real engine (OPERATON_URL), see README.
integration = []

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
wiremock = "0.6"
