<html lang="en">
<head>
<meta charset="utf-8">
<title>Process test coverage</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
  header { padding: 12px 20px; background: #1f3a5f; color: #fff; }
  header h1 { margin: 0; font-size: 18px; }
  header small { opacity: .8; }
  main { display: flex; min-height: calc(100vh - 60px); }
  aside { width: 300px; padding: 12px; border-right: 1px solid #ddd; overflow: auto; }
  section { flex: 1; padding: 12px 20px; min-width: 0; }
  .item { padding: 6px 8px; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .item:hover { background: #eef2f7; }
  .item.sel { background: #d6e4f5; font-weight: 600; }
  .pct { font-variant-numeric: tabular-nums; }
  .tabs button { margin-right: 4px; padding: 4px 10px; border: 1px solid #aaa; background: #f6f6f6; cursor: pointer; }
  .tabs button.sel { background: #1f3a5f; color: #fff; }
  #canvas { height: 560px; border: 1px solid #ddd; margin-top: 10px; }
  .covered:not(.djs-connection) .djs-visual > :nth-child(1) { fill: #b7e4b4 !important; stroke: #2e7d32 !important; }
  .covered.djs-connection .djs-visual > path { stroke: #2e7d32 !important; stroke-width: 3px !important; }
  .uncovered:not(.djs-connection) .djs-visual > :nth-child(1) { fill: #fbd3d3 !important; stroke: #b71c1c !important; }
  .uncovered.djs-connection .djs-visual > path { stroke: #b71c1c !important; stroke-dasharray: 6 4; }
  .bar { height: 8px; background: #f3c1c1; border-radius: 4px; overflow: hidden; margin: 6px 0 12px; }
  .bar > div { height: 100%; background: #43a047; }
  .lists { display: flex; gap: 40px; flex-wrap: wrap; }
  .lists h3 { margin: 12px 0 4px; font-size: 14px; }
  .lists ul { margin: 0; padding-left: 18px; }
  .legend span { display: inline-block; padding: 1px 8px; margin-right: 8px; border-radius: 3px; font-size: 12px; }
  #fallback { color: #8a4b00; display: none; margin-top: 8px; }
</style>
<link id="bpmnjs-css" rel="stylesheet">
</head>
<body>
<header><h1 id="title"></h1><small id="meta"></small></header>
<main>
  <aside><div id="runs"></div></aside>
  <section>
    <div class="tabs" id="models"></div>
    <div id="summary"></div>
    <div class="legend"><span style="background:#b7e4b4">covered</span><span style="background:#fbd3d3">not covered</span></div>
    <div id="fallback">bpmn-js could not be loaded (offline?). The lists below show the same result.</div>
    <div id="canvas"></div>
    <div class="lists" id="lists"></div>
  </section>
</main>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const pct = r => r == null ? 'n/a' : (r * 100).toFixed(1) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let selRun = null, selModel = DATA.models.length ? DATA.models[0].key : null, viewer = null, shownKey = null;

document.getElementById('bpmnjs-css').href = DATA.bpmnJsCssUrl;
document.getElementById('title').textContent = 'Process test coverage: ' + DATA.name;
document.getElementById('meta').textContent = 'generated ' + DATA.generatedAt + ' - suite coverage ' + pct(DATA.coverage.ratio);

function coverageOf(model) {
  const cov = selRun === null ? DATA.coverage : DATA.runs.find(r => r.id === selRun).coverage;
  return cov.models.find(m => m.processKey === model.key) ||
    {ratio: 0, covered: 0, total: model.totalElementCount, coveredFlowNodeIds: [], coveredSequenceFlowIds: []};
}
function renderRuns() {
  const el = document.getElementById('runs');
  const row = (id, label, ratio) => '<div class="item' + (selRun === id ? ' sel' : '') + '" data-id="' + (id === null ? '' : esc(id)) +
    '"><span>' + esc(label) + '</span><span class="pct">' + pct(ratio) + '</span></div>';
  el.innerHTML = row(null, 'All tests', DATA.coverage.ratio) + DATA.runs.map(r => row(r.id, r.displayName, r.coverage.ratio)).join('');
  el.querySelectorAll('.item').forEach(n => n.onclick = () => { selRun = n.dataset.id === '' ? null : n.dataset.id; render(); });
}
function renderModels() {
  const el = document.getElementById('models');
  el.innerHTML = DATA.models.map(m => '<button class="' + (m.key === selModel ? 'sel' : '') + '" data-k="' + esc(m.key) + '">' + esc(m.key) + '</button>').join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { selModel = b.dataset.k; render(); });
}
async function renderDiagram(model, cov) {
  const covered = new Set(cov.coveredFlowNodeIds.concat(cov.coveredSequenceFlowIds));
  const all = model.flowNodeIds.concat(model.sequenceFlowIds);
  if (typeof BpmnJS === 'undefined') { document.getElementById('fallback').style.display = 'block'; return; }
  if (shownKey !== model.key) {
    if (viewer) viewer.destroy();
    viewer = new BpmnJS({container: '#canvas'});
    await viewer.importXML(model.bpmn);
    viewer.get('canvas').zoom('fit-viewport');
    shownKey = model.key;
  }
  const canvas = viewer.get('canvas'), registry = viewer.get('elementRegistry');
  all.forEach(id => {
    if (!registry.get(id)) return;
    canvas.removeMarker(id, 'covered'); canvas.removeMarker(id, 'uncovered');
    canvas.addMarker(id, covered.has(id) ? 'covered' : 'uncovered');
  });
}
function render() {
  renderRuns(); renderModels();
  const model = DATA.models.find(m => m.key === selModel);
  if (!model) { document.getElementById('summary').textContent = 'No process was executed.'; return; }
  const cov = coverageOf(model);
  document.getElementById('summary').innerHTML = '<h2>' + esc(model.key) + (model.versionTag ? ' (' + esc(model.versionTag) + ')' : '') + ' - ' +
    pct(cov.ratio) + ' <small>' + cov.covered + ' of ' + cov.total + ' elements</small></h2><div class="bar"><div style="width:' + (cov.ratio * 100) + '%"></div></div>';
  const done = new Set(cov.coveredFlowNodeIds.concat(cov.coveredSequenceFlowIds));
  const list = (title, ids) => '<div><h3>' + title + ' (' + ids.length + ')</h3><ul>' + ids.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul></div>';
  const all = model.flowNodeIds.concat(model.sequenceFlowIds);
  document.getElementById('lists').innerHTML = list('Covered', all.filter(i => done.has(i))) + list('Not covered', all.filter(i => !done.has(i)));
  renderDiagram(model, cov).catch(e => { document.getElementById('fallback').style.display = 'block'; console.error(e); });
}
const script = document.createElement('script');
script.src = DATA.bpmnJsUrl;
script.onload = render; script.onerror = render;
document.body.appendChild(script);
</script>
</body>
</html>
